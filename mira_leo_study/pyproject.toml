[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-leo-study"
version = "1.0.0"
description = "Reproducible synthetic MIRA-LEO parameter-study implementation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14",
  "PyYAML>=6",
  "matplotlib>=3.8"
]

[tool.setuptools]
package-dir = {"mira_leo_study" = "."}
packages = ["mira_leo_study"]

[tool.setuptools.package-data]
mira_leo_study = ["configs/*.yaml"]
